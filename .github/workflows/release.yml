name: release

# Only runs after the "tests" workflow finishes successfully on master — never
# releases anything that hasn't passed the test suite. See tests.yml.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [master]

# Every job below pushes a commit (and sometimes a tag) back to master on
# success. Running them in parallel means whichever finishes first moves
# origin/master out from under the others mid-run — semantic-release detects
# its checkout is now behind the remote and safely aborts rather than
# publishing from stale state ("The local branch master is behind the remote
# one, therefore a new version won't be published."). Chaining them with
# `needs:` forces one at a time, so each job's checkout always reflects
# whatever the previous one already pushed.
jobs:
  release-laravel:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-client:
    needs: release-laravel
    if: always() && needs.release-laravel.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # trusted publishing needs npm >=11.5.1
      - run: npm ci
        working-directory: adapters
      - run: npm run build
        working-directory: adapters
      - run: npx semantic-release
        working-directory: adapters/vifrost-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-codegen:
    needs: release-client
    if: always() && needs.release-client.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
        working-directory: adapters
      - run: npm run build
        working-directory: adapters
      - run: npx semantic-release
        working-directory: adapters/vifrost-codegen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-vue:
    needs: [release-client, release-codegen]
    if: always() && needs.release-codegen.result != 'cancelled' && needs.release-client.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
        working-directory: adapters
      - run: npm run build
        working-directory: adapters
      - run: npx semantic-release
        working-directory: adapters/vifrost-vue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
